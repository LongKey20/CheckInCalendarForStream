<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Twitch 簽到月曆（FINAL FULL + SOUND）</title>

<link id="themeStyle" rel="stylesheet" href="theme/default.css">
</head>

<body>

<audio id="stampSound" src="audio/stamp.mp3" preload="auto"></audio>

<div class="calendar-container" id="calendarBox">

    <div class="banner-alert" id="alertText">
        🎉 Twitch 簽到系統
    </div>

    <div class="calendar-header" id="calendarTitle"></div>

    <div class="days-grid" id="daysGrid">
        <div class="day-name">日</div>
        <div class="day-name">一</div>
        <div class="day-name">二</div>
        <div class="day-name">三</div>
        <div class="day-name">四</div>
        <div class="day-name">五</div>
        <div class="day-name">六</div>
    </div>

</div>

<script>

/* ===================== CONFIG ===================== */
const CONFIG = {
    channel: "",
    displaySeconds: 6,
    timeZone: "Asia/Tokyo",
    dataUrl: "/calendar",
    apiWriteUrl: "/api/write-csv",
    style: "theme/default.css"
};

const COMMANDS = ["!月曆", "!Calendar"];

async function loadClientConfig(){
    try {
        const response = await fetch("config/client_config.json", { cache: "no-store" });
        if (!response.ok) {
            console.warn("No external config found, using defaults.");
            return;
        }
        const config = await response.json();
        Object.assign(CONFIG, config);

        if (typeof CONFIG.style === "string" && CONFIG.style.trim() !== "") {
            const styleLink = document.getElementById("themeStyle");
            if (styleLink) {
                styleLink.href = CONFIG.style.trim();
            }
        }
    } catch (err) {
        console.warn("Failed to load client_config.json", err);
    }
}

async function loadCommandConfig(){
    try {
        const response = await fetch("config/command.json", { cache: "no-store" });
        if (!response.ok) {
            console.warn("No command.json found, using default commands.");
            return;
        }
        const json = await response.json();
        const list = Array.isArray(json.ShowCalendarCommand)
            ? json.ShowCalendarCommand
            : Array.isArray(json.commands)
                ? json.commands
                : Array.isArray(json)
                    ? json
                    : null;

        if (Array.isArray(list) && list.length > 0) {
            COMMANDS.length = 0;
            COMMANDS.push(...list.map(item => String(item).trim()).filter(Boolean));
        } else {
            console.warn("command.json did not contain a valid ShowCalendarCommand list. Using default commands.");
        }
    } catch (err) {
        console.warn("Failed to load command.json", err);
    }
}

const CSV_HEADERS = [
    "date",
    "username",
    "displayName",
    "timestamp",
    "isFirst"
];

/* ===================== COMMAND PARSER ===================== */
function tryParseCommandAndDate(message){
    // Supported formats: !月曆, !月曆2026-06, !月曆 2026-06, !月曆 2026/6
    const text = String(message || "").trim();
    if(!text){
        return { isCommand: false, dateOverride: null };
    }

    const normalizedText = text.toLowerCase();
    const command = COMMANDS
        .map(cmd => String(cmd || "").trim())
        .filter(Boolean)
        .sort((a, b) => b.length - a.length)
        .find(cmd => normalizedText.startsWith(cmd.toLowerCase()));

    if(!command){
        return { isCommand: false, dateOverride: null };
    }

    const dateArg = text.substring(command.length).trim();
    if(!dateArg){
        return { isCommand: true, dateOverride: null };
    }

    const dateMatch = dateArg.match(/^(\d{4})[-/](\d{1,2})$/);
    if(!dateMatch){
        return { isCommand: true, dateOverride: null };
    }

    const year = Number(dateMatch[1]);
    const month = Number(dateMatch[2]) - 1;
    if(year >= 2000 && year <= 2099 && month >= 0 && month <= 11){
        return { isCommand: true, dateOverride: { year, month } };
    }
    
    return { isCommand: true, dateOverride: null };
}

function getDateInfo(dateOverride){
    if(dateOverride){
        return {
            year: dateOverride.year,
            month: dateOverride.month,
            today: null
        };
    }
    return getNowInfo();
}

/* ===================== STATE ===================== */
const queue = [];

let currentYear = null;
let currentMonth = null;
let currentToday = null;

/* ===================== DOM ===================== */
const box = document.getElementById("calendarBox");
const grid = document.getElementById("daysGrid");
const alertText = document.getElementById("alertText");

/* ===================== CSV HELPERS ===================== */
async function readLocalCsv(dateOverride){
    let url = CONFIG.dataUrl;
    
    // If dateOverride is provided, append query parameters
    if(dateOverride){
        const params = new URLSearchParams({
            year: dateOverride.year,
            month: String(dateOverride.month + 1) // Convert back to 1-indexed
        });
        url = `${CONFIG.dataUrl}?${params.toString()}`;
    }
    
    try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
        }
        const text = await response.text();
        return text ? parseCsv(text) : [];
    } catch (err) {
        console.error("Failed to load CSV from backend:", err);
        return [];
    }
}

async function writeLocalCsv(rows){
    const csvText = stringifyCsv(rows);

    const response = await fetch(CONFIG.apiWriteUrl, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            csv: csvText
        })
    });

    if (!response.ok) {
        const body = await response.text();
        throw new Error(`CSV write failed: ${response.status} ${body}`);
    }
}

function parseCsv(text){
    const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(line => line.trim() !== "");
    const rows = [];
    let current = [];
    let field = "";
    let inQuotes = false;

    for(const line of lines){
        if(line === "" && !inQuotes){
            if(current.length > 0){
                rows.push(current);
                current = [];
            }
            continue;
        }

        for(let i = 0; i < line.length; i++){
            const ch = line[i];

            if(ch === '"'){
                if(inQuotes && line[i+1] === '"'){
                    field += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if(ch === ',' && !inQuotes){
                current.push(field);
                field = "";
            } else {
                field += ch;
            }
        }

        if(!inQuotes){
            current.push(field);
            rows.push(current);
            current = [];
            field = "";
        } else {
            field += "\n";
        }
    }

    if(current.length || field){
        current.push(field);
        rows.push(current);
    }

    return rows;
}

function stringifyCsv(rows){
    return rows
        .filter(row => Array.isArray(row) && row.length > 0)
        .map(row => row.map(field => {
            const value = String(field || "");
            if(value.includes(",") || value.includes("\"") || value.includes("\n")){
                return `"${value.replace(/"/g, '""')}"`;
            }
            return value;
        }).join(",")).join("\r\n");
}

function getConfiguredTimeZone(){
    const timeZone = String(CONFIG.timeZone || "").trim();
    return timeZone || "Asia/Tokyo";
}

function getDateTimeParts(date, locale, options){
    const timeZone = getConfiguredTimeZone();

    try {
        return new Intl.DateTimeFormat(locale, {
            ...options,
            timeZone
        }).formatToParts(date);
    } catch (err) {
        console.warn(`Invalid timeZone "${timeZone}". Falling back to Asia/Tokyo.`, err);
        return new Intl.DateTimeFormat(locale, {
            ...options,
            timeZone: "Asia/Tokyo"
        }).formatToParts(date);
    }
}

function formatConfiguredTimestamp(date){
    const opts = {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    };
    const parts = getDateTimeParts(date, "en-GB", opts);
    const map = {};
    for(const part of parts){
        if(part.type !== "literal"){
            map[part.type] = part.value;
        }
    }
    return `${map.year}-${map.month}-${map.day} ${map.hour}:${map.minute}:${map.second}`;
}

async function localRequest(event){
    const dateStr = event.dateKey;
    const username = event.username;
    const displayName = event.displayName;
    const isViewingHistoricalMonth = !!event.dateOverride; // True if viewing a specific month other than current
    const isCommand = event.isCommand; // True if this is a command (show calendar only, don't sign in)
    
    const rows = await readLocalCsv(event.dateOverride);
    const data = rows.length ? rows : [CSV_HEADERS];

    let hasAnyToday = false;
    let alreadyUserToday = false;
    const userDates = [];

    for(let i = 1; i < data.length; i++){
        const row = data[i];
        if(!row || row.length < 2) continue;
        const rowDate = row[0];
        const rowUser = row[1];
        const rowIsFirst = String(row[4] || "").toUpperCase() === "YES";

        if(rowUser === username){
            userDates.push({
                date: rowDate,
                isFirst: rowIsFirst
            });
        }

        if(dateStr && rowDate === dateStr){
            hasAnyToday = true;
            if(rowUser === username){
                alreadyUserToday = true;
            }
        }
    }

    if(!dateStr){
        return {
            success: true,
            showCalendar: true,
            isFirst: false,
            userDates,
            signedToday: alreadyUserToday
        };
    }

    // If viewing historical/future month, only show calendar, don't allow sign-in
    if(isViewingHistoricalMonth){
        return {
            success: true,
            showCalendar: true,
            isFirst: false,
            userDates,
            signedToday: false
        };
    }

    // If this is a command (show calendar only, don't sign in)
    if(isCommand){
        return {
            success: true,
            showCalendar: true,
            isFirst: false,
            userDates,
            signedToday: alreadyUserToday
        };
    }

    // Below: regular sign-in logic (not a command)
    if(alreadyUserToday){
        if(event.forceShowCalendar){
            return {
                success: true,
                showCalendar: true,
                isFirst: false,
                userDates,
                signedToday: true
            };
        }

        return {
            success: true,
            showCalendar: false,
            isFirst: false,
            userDates: []
        };
    }

    const isFirst = !hasAnyToday;
    const timestamp = formatConfiguredTimestamp(new Date());

    data.push([
        dateStr,
        username,
        displayName,
        timestamp,
        isFirst ? "YES" : "NO"
    ]);

    await writeLocalCsv(data);
    userDates.push({
        date: dateStr,
        isFirst
    });

    return {
        success: true,
        showCalendar: true,
        isFirst,
        userDates
    };
}

/* ===================== TIME ===================== */
function getNowInfo(){

    const opts = {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    };
    const parts = getDateTimeParts(new Date(), "en-CA", opts);
    const map = {};
    for(const part of parts){
        if(part.type !== "literal"){
            map[part.type] = part.value;
        }
    }

    return {
        year: Number(map.year),
        month: Number(map.month) - 1,
        today: Number(map.day)
    };
}

/* ===================== CALENDAR ===================== */
const dayCells = {};

function rebuildCalendar(year, month, today){

    currentYear = year;
    currentMonth = month;
    currentToday = today;

    grid.innerHTML = `
        <div class="day-name">日</div>
        <div class="day-name">一</div>
        <div class="day-name">二</div>
        <div class="day-name">三</div>
        <div class="day-name">四</div>
        <div class="day-name">五</div>
        <div class="day-name">六</div>
    `;

    Object.keys(dayCells).forEach(k => delete dayCells[k]);

    document.getElementById("calendarTitle").innerText =
    `${year} 年 ${String(month+1).padStart(2,'0')} 月`;

    const first = new Date(year, month, 1).getDay();
    const total = new Date(year, month+1, 0).getDate();

    for(let i=0;i<first;i++){

        const e=document.createElement("div");
        e.className="empty-day";
        grid.appendChild(e);
    }

    for(let d=1; d<=total; d++){

        const cell=document.createElement("div");
        cell.className="day";

        const num=document.createElement("div");
        num.className="day-number";
        num.innerText=d;

        cell.appendChild(num);

        if(d===today){
            cell.classList.add("today-day");
        }

        grid.appendChild(cell);

        dayCells[d]=cell;
    }
}

/* ===================== SOUND ===================== */
function playSound(){

    const audio = document.getElementById("stampSound");

    if(!audio) return;

    audio.currentTime = 0;

    audio.play().catch(err => {
        console.warn("Stamp sound was blocked or failed to play.", err);
    });
}

function parseCssTime(value){
    const text = String(value || "").trim();
    const match = text.match(/^(-?\d+(?:\.\d+)?)(ms|s)$/);
    if(!match) return 0;

    const amount = Number(match[1]);
    return match[2] === "s" ? amount * 1000 : amount;
}

function setupStampSound(){
    document.addEventListener("animationstart", event => {
        if(
            event.animationName === "stampPop" &&
            event.target.classList.contains("stamp-animation")
        ){
            const style = getComputedStyle(event.target);
            const delay = parseCssTime(style.getPropertyValue("--stamp-sound-delay"));
            setTimeout(playSound, delay);
        }
    });
}

/* ===================== QUEUE ===================== */
function enqueue(event){

    const dateInfo = getDateInfo(event.dateOverride);

    event.uiYear = dateInfo.year;
    event.uiMonth = dateInfo.month;
    event.uiToday = dateInfo.today;

    queue.push(event);

    if(queue.length === 1){
        process();
    }
}

function shouldRebuildCalendar(event){
    if(event.isCommand){
        return true;
    }

    return (
        event.uiYear !== currentYear ||
        event.uiMonth !== currentMonth ||
        event.uiToday !== currentToday
    );
}

function process(){

    if(queue.length===0) return;

    showEvent(queue[0])
    .catch(err => {
        console.error("Calendar event failed:", err);
    })
    .finally(()=>{
        queue.shift();
        process();
    });
}

/* ===================== AVATAR ===================== */
function clearAllAvatars(){

    Object.values(dayCells).forEach(cell => {

        cell.classList.remove("first-stamp-day");

        const img = cell.querySelector("img");

        if(img){
            img.remove();
        }
    });
}

function renderUserDates(userDates, avatar, animateDateKey){

    clearAllAvatars();

    if(!Array.isArray(userDates) || userDates.length === 0) return;

    for(const userDate of userDates){

        const date = userDate.date;
        if(typeof date !== "string") continue;

        const day = parseInt(date.split("-")[2]);

        const cell = dayCells[day];

        if(!cell) continue;

        const img = document.createElement("img");

        img.src = avatar;
        img.className = "user-avatar";

        cell.appendChild(img);

        if(userDate.isFirst){
            cell.classList.add("first-stamp-day");
        }

        if(animateDateKey && date === animateDateKey){
            requestAnimationFrame(() => {
                img.classList.add("stamp-animation");
            });
        }
    }
}

/* ===================== EVENT ===================== */
function showEvent(event){

return new Promise((resolve)=>{

    const targetYear = event.uiYear;
    const targetMonth = event.uiMonth;
    const targetToday = event.uiToday;

    if(shouldRebuildCalendar(event)){
        rebuildCalendar(
            targetYear,
            targetMonth,
            targetToday
        );
    }

    localRequest(event)
    .then(json=>{

        if(!json.showCalendar){

            box.classList.remove("show");

            alertText.innerText =
            `${event.displayName} 已簽到`;

            resolve();

            return;
        }

        box.classList.add("show");

        if(event.dateOverride){
            alertText.innerText =
            `${event.displayName} 的 ${event.uiYear}-${String(event.uiMonth+1).padStart(2,'0')} 簽到月曆`;
        } else if(json.isFirst){
            alertText.innerText = `👑 ${event.displayName} 搶到頭香！`;
        } else if(json.signedToday){
            alertText.innerText = `${event.displayName} 今日已簽到`;
        } else {
            alertText.innerText = `${event.displayName} 已簽到`;
        }

        const animateDateKey = json.signedToday ? null : event.dateKey;
        renderUserDates(
            json.userDates,
            event.avatar,
            animateDateKey
        );

        setTimeout(()=>{

            box.classList.remove("show");

            resolve();

        }, CONFIG.displaySeconds * 1000);

    })
    .catch(err=>{

        console.log(err);

        alertText.innerText =
        "⚠️ API error";

        resolve();
    });

});
}

/* ===================== TWITCH ===================== */
function connect(){

    const ws =
    new WebSocket(
        "wss://irc-ws.chat.twitch.tv:443"
    );

    ws.onopen=()=>{

        ws.send("PASS SCHMOOPIE");

        ws.send(
            "NICK justinfan"+
            Math.floor(Math.random()*99999)
        );

        ws.send(`JOIN #${CONFIG.channel}`);
    };

    ws.onmessage=(ev)=>{

        const msgs =
        ev.data.split("\r\n");

        for(const msg of msgs){

            if(!msg.includes("PRIVMSG"))
                continue;

            const u =
            msg.match(/:([^!]+)!/);

            if(!u) continue;

            const username =
            u[1].toLowerCase();

            const display =
            msg.match(
                /display-name=([^;]*)/
            )?.[1] || username;

            const textMatch = msg.match(/PRIVMSG #[^ ]+ :(.*)$/);
            const message = textMatch ? textMatch[1].trim() : "";
            const commandInfo = tryParseCommandAndDate(message);
            const isCheckCommand = commandInfo.isCommand;

            if(isCheckCommand){
                console.log("Calendar command parsed:", message, commandInfo);
            }

            const dateInfo = getDateInfo(commandInfo.dateOverride);

            enqueue({

                username,

                displayName:display,

                avatar:
                `https://unavatar.io/twitch/${username}`,

                dateKey:
                dateInfo.today
                    ? `${dateInfo.year}-${String(dateInfo.month+1).padStart(2,'0')}-${String(dateInfo.today).padStart(2,'0')}`
                    : null,

                dateOverride: commandInfo.dateOverride,

                isCommand: commandInfo.isCommand,

                forceShowCalendar: isCheckCommand
            });
        }
    };

    ws.onclose=()=>{

        setTimeout(connect,3000);
    };
}

async function initApp(){
    setupStampSound();
    await loadClientConfig();
    await loadCommandConfig();

    const init = getNowInfo();
    rebuildCalendar(init.year, init.month, init.today);
    connect();
}

initApp();

</script>
</body>
</html>
